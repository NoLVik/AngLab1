<div style="font-family: sans-serif; max-width: 600px; margin: 20px auto; padding: 20px; border: 1px solid #ddd; border-radius: 8px;">
  <h2>Керування курсами (BehaviorSubject)</h2>

  <form [formGroup]="courseForm" (ngSubmit)="onSubmit()" style="margin-bottom: 30px; padding: 15px; background: #f9f9f9; border-radius: 8px;">
    <h3>Додати новий курс</h3>
    
    <div style="margin-bottom: 10px;">
      <input type="text" formControlName="title" placeholder="Назва курсу" style="width: 100%; padding: 8px; box-sizing: border-box;">
    </div>
    <div style="margin-bottom: 10px;">
      <input type="text" formControlName="category" placeholder="Категорія" style="width: 100%; padding: 8px; box-sizing: border-box;">
    </div>
    <div style="margin-bottom: 10px;">
      <input type="text" formControlName="duration" placeholder="Тривалість (напр. 10 годин)" style="width: 100%; padding: 8px; box-sizing: border-box;">
    </div>
    
    <button type="submit" [disabled]="courseForm.invalid" style="padding: 10px 15px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer;">
      Додати курс
    </button>
  </form>
  
  <h3>Актуальний список:</h3>
  <ng-container *ngIf="courses$ | async as courses">
    <div *ngIf="courses.length > 0; else noCourses">
      <div *ngFor="let course of courses" style="display: flex; justify-content: space-between; align-items: center; border: 1px solid #ccc; padding: 15px; margin-bottom: 10px; border-radius: 8px;">
        
        <div>
          <h4 style="margin: 0 0 5px 0;">{{ course.title }}</h4>
          <p style="margin: 0; font-size: 14px; color: #555;">Категорія: {{ course.category }} | {{ course.duration }}</p>
        </div>

        <button (click)="onDelete(course.id)" style="padding: 8px 12px; background: #dc3545; color: white; border: none; border-radius: 4px; cursor: pointer;">
          Видалити
        </button>
        
      </div>
    </div>
    <ng-template #noCourses>
      <p>Список курсів порожній.</p>
    </ng-template>
  </ng-container>
</div>
